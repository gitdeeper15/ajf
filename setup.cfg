[metadata]
name = agent-judge-framework
version = 1.0.0
description = Automated Evaluation and Reliability Assessment of Tool-Using Autonomous Agents
long_description = file: README.md
long_description_content_type = text/markdown
author = Samir Baladi
author_email = gitdeeper@gmail.com
license = MIT
license_files = LICENSE
project_urls =
    Homepage = https://github.com/gitdeeper15/ajf
    Zenodo = https://doi.org/10.5281/zenodo.23907823
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
packages = find:
install_requires =
    pandas>=1.5.0
    numpy>=1.23.0
    scipy>=1.9.0
    scikit-learn>=1.0.0
    requests>=2.28.0
python_requires = >=3.11

[options.packages.find]
exclude =
    tests
    tests.*
    docs
    docs.*
    PUBLICATION
    PUBLICATION.*
    EXPERIMENTS
    EXPERIMENTS.*

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = .git,__pycache__,build,dist,venv,.venv

[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
