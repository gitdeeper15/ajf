[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-judge-framework"
version = "1.0.0"
description = "A Reliability-Oriented Framework for Automated Evaluation of Tool-Using Autonomous Agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Samir Baladi", email = "gitdeeper@gmail.com"},
]
maintainers = [
    {name = "Samir Baladi", email = "gitdeeper@gmail.com"},
]
keywords = [
    "autonomous agents",
    "LLM-as-a-judge",
    "evaluation reliability",
    "tool execution",
    "evidence verification",
    "judge calibration",
    "benchmark design",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.0.0",
    "scipy>=1.9.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/gitdeeper15/ajf"
Manuscript = "https://doi.org/10.5281/zenodo.23907823"
Zenodo = "https://doi.org/10.5281/zenodo.23907823"
PyPI = "https://pypi.org/project/agent-judge-framework/"
ORCID = "https://orcid.org/0009-0003-8903-0029"

[tool.setuptools]
packages = ["ajf"]

[tool.setuptools.package-data]
ajf = ["data/*.json", "data/*.csv"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
